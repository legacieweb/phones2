services:
  # Backend API
  - type: web
    name: phones-api
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node server/index.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: phones-db
          property: connectionString
      - key: NODE_VERSION
        value: 20
      - key: PORT
        value: 10000

  # Frontend Static Site
  - type: web
    name: phones-frontend
    env: static
    plan: free
    buildCommand: npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: phones-api
          property: host
      - key: VITE_PAYSTACK_PUBLIC_KEY
        sync: false # User should set this in Render UI

databases:
  - name: phones-db
    plan: free
